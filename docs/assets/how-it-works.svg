<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">How PersonaKit 0.1 works</title><desc id="d">Session files are read on your machine, only the turns you wrote are sent to the model you chose, proposed memories are stored in a local SQLite file, you can review them, and an MCP server serves approved and unconfirmed memories to your assistants.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#416345"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b54b32"/></marker></defs>
<rect width="760" height="340" fill="#f6f4ee"/>
<rect x="18" y="44" width="566" height="278" rx="12" fill="none" stroke="#829074" stroke-width="1.3" stroke-dasharray="6 5"/>
<text x="34" y="34" text-anchor="start" font-size="10" font-weight="700" fill="#536345">YOUR MACHINE</text>
<text x="614" y="34" text-anchor="start" font-size="10" font-weight="700" fill="#963c26">OUTSIDE YOUR MACHINE</text>
<rect x="40" y="84" width="130" height="60" rx="8" fill="#fffef9" stroke="#416345" stroke-width="1.3"/><text x="105.0" y="110.0" text-anchor="middle" font-size="13" font-weight="650" fill="#292d27">Session files</text><text x="105.0" y="126.0" text-anchor="middle" font-size="11" fill="#56614f">Claude Code, Codex</text>
<rect x="208" y="84" width="120" height="60" rx="8" fill="#fffef9" stroke="#416345" stroke-width="1.3"/><text x="268.0" y="110.0" text-anchor="middle" font-size="13" font-weight="650" fill="#292d27">1. Sweep</text><text x="268.0" y="126.0" text-anchor="middle" font-size="11" fill="#56614f">keeps your turns</text>
<rect x="366" y="84" width="120" height="60" rx="8" fill="#fffef9" stroke="#416345" stroke-width="1.3"/><text x="426.0" y="110.0" text-anchor="middle" font-size="13" font-weight="650" fill="#292d27">2. Extract</text><text x="426.0" y="126.0" text-anchor="middle" font-size="11" fill="#56614f">proposes memories</text>
<rect x="614" y="84" width="128" height="60" rx="8" fill="#f8eee7" stroke="#b54b32" stroke-width="1.3"/><text x="678.0" y="110.0" text-anchor="middle" font-size="13" font-weight="650" fill="#292d27">Model you chose</text><text x="678.0" y="126.0" text-anchor="middle" font-size="11" fill="#56614f">your own CLI login</text>
<path d="M170 114H206" fill="none" stroke="#416345" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M328 114H364" fill="none" stroke="#416345" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M486 102H612" fill="none" stroke="#b54b32" stroke-width="1.5" marker-end="url(#r)"/>
<text x="549" y="94" text-anchor="middle" font-size="11" font-weight="400" fill="#963c26">your turns only</text>
<path d="M614 128H488" fill="none" stroke="#b54b32" stroke-width="1.5" marker-end="url(#r)"/>
<text x="549" y="146" text-anchor="middle" font-size="11" font-weight="400" fill="#963c26">proposed memories</text>
<path d="M426 144V186H290V224" fill="none" stroke="#416345" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="226" width="140" height="64" rx="8" fill="#e9ecdf" stroke="#416345" stroke-width="1.3"/><text x="110.0" y="254.0" text-anchor="middle" font-size="13" font-weight="650" fill="#292d27">4. Review</text><text x="110.0" y="270.0" text-anchor="middle" font-size="11" fill="#56614f">optional, in your terminal</text>
<rect x="220" y="226" width="140" height="64" rx="8" fill="#fffef9" stroke="#416345" stroke-width="1.3"/><text x="290.0" y="254.0" text-anchor="middle" font-size="13" font-weight="650" fill="#292d27">3. Local store</text><text x="290.0" y="270.0" text-anchor="middle" font-size="11" fill="#56614f">one SQLite file</text>
<rect x="400" y="226" width="140" height="64" rx="8" fill="#fffef9" stroke="#416345" stroke-width="1.3"/><text x="470.0" y="254.0" text-anchor="middle" font-size="13" font-weight="650" fill="#292d27">5. MCP server</text><text x="470.0" y="270.0" text-anchor="middle" font-size="11" fill="#56614f">personakit serve</text>
<rect x="614" y="226" width="128" height="64" rx="8" fill="#f8eee7" stroke="#b54b32" stroke-width="1.3"/><text x="678.0" y="254.0" text-anchor="middle" font-size="13" font-weight="650" fill="#292d27">Your assistants</text><text x="678.0" y="270.0" text-anchor="middle" font-size="11" fill="#56614f">any MCP client</text>
<path d="M182 258H218" fill="none" stroke="#416345" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M360 248H398" fill="none" stroke="#416345" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M542 248H612" fill="none" stroke="#b54b32" stroke-width="1.5" marker-end="url(#r)"/>
<text x="678" y="212" text-anchor="middle" font-size="11" font-weight="400" fill="#963c26">approved and unconfirmed only</text>
<path d="M612 272H542" fill="none" stroke="#b54b32" stroke-width="1.5" marker-end="url(#r)"/>
<text x="577" y="290" text-anchor="middle" font-size="11" font-weight="400" fill="#963c26">proposals</text>
<path d="M400 272H362" fill="none" stroke="#416345" stroke-width="1.5" marker-end="url(#a)"/>
<text x="300" y="312" text-anchor="middle" font-size="11" font-weight="650" fill="#536345">No PersonaKit server. No account. Nothing else leaves.</text>
</svg>
