[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personakit"
version = "0.0.1"
description = "Memory for your AI assistants that you can read, correct and take with you."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]

[project.scripts]
personakit = "personakit.cli:main"

[tool.setuptools.packages.find]
include = ["personakit*"]
