name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with the optional MCP dependency)
        run: python -m pip install -e ".[mcp]"
      - name: Run tests
        run: python -m unittest discover -s tests -t .
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install (with the optional MCP dependency and the checkers)
        run: python -m pip install -e ".[mcp]" ruff coverage
      - name: Lint
        run: ruff check .
      - name: Tests with coverage floor (see pyproject.toml)
        run: |
          python -m coverage run -m unittest discover -s tests -t .
          python -m coverage report
