name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with the optional MCP dependency)
        run: python -m pip install -e ".[mcp]"
      - name: Run tests
        run: python -m unittest discover -s tests -t .
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install (with the optional MCP dependency and the checkers)
        run: python -m pip install -e ".[mcp]" ruff coverage
      - name: Lint
        run: ruff check .
      - name: Tests with coverage floor (see pyproject.toml)
        run: |
          python -m coverage run -m unittest discover -s tests -t .
          python -m coverage report
